<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — ConceptAcademy</title>
    <meta name="description" content="Contact ConceptAcademy for questions or collaborations.">
    <link rel="icon" href="assets/logo.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html"><img class="logo" src="assets/logo.svg" alt="ConceptAcademy logo"></a>
        <nav>
          <a href="index.html">Home</a>
          <a href="grades.html">Grades</a>
          <a href="students.html">Students</a>
          <a href="guardians.html">Guardians</a>
          <a href="teachers.html">Teachers</a>
          <a href="curious-learners.html">Curious Learners</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2>Contact</h2>
      <p>Questions or collaboration? Use the form below or email <a href="mailto:hello@conceptacademy.example">hello@conceptacademy.example</a>.</p>

      <form id="contactForm" class="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send message</button>
        <p class="form-note">Alternatively email <a href="mailto:hello@conceptacademy.example">hello@conceptacademy.example</a></p>
      </form>

    </main>

    <footer class="site-footer">
      <div class="container">
        <small>© ConceptAcademy</small>
      </div>
    </footer>
  </body>
</html>
